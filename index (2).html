<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một Lá Thư</title>
<meta name="description" content="Một lá thư tay gửi người quan trọng, kèm mã QR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#2b3140;
    --bg-2:#1b1f29;
    --paper:#f6efe0;
    --paper-2:#efe6d2;
    --paper-edge:#ded1ad;
    --ink:#2a2f3d;
    --ink-soft:#4a5062;
    --accent:#7a2331;
    --accent-2:#5c1a24;
    --gold:#b6924f;
    --gold-light:#d8c08a;
    --hint:#cbd0dc;
    --ring:rgba(182,146,79,.55);
    --panel-bg:#191d26;
    --panel-line:#333a48;
    --panel-text:#e7e9ee;
    --panel-muted:#9aa1b3;
    --field-bg:#11151c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-1:#14161d;
      --bg-2:#0a0b10;
      --hint:#9aa1b3;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(16px, 5vw, 48px) 16px;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(255,255,255,.05), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.35), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    color: var(--hint);
    overflow-x:hidden;
  }
  .scene{
    position:relative;
    width:100%;
    max-width: 640px;
    min-height: min(72vh, 620px);
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 1400px;
  }

  /* ---------- Phong bì ---------- */
  .envelope-wrap{
    position:relative;
    width: min(360px, 84vw);
    z-index: 2;
    transition: opacity .6s ease .15s, transform .6s ease .15s, filter .6s ease .15s;
  }
  .envelope-wrap.is-hidden{
    opacity:0;
    transform: scale(.85) translateY(10px);
    filter: blur(2px);
    pointer-events:none;
  }
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 2;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transform-style: preserve-3d;
  }
  .envelope:focus-visible{ outline: 2px solid var(--ring); outline-offset: 6px; border-radius: 6px; }

  .env-shadow{
    position:absolute;
    left:6%; right:6%; bottom:-9%;
    height: 18%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.45), transparent 72%);
    filter: blur(2px);
  }
  .env-back{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--paper), var(--paper-2));
    border-radius: 3px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.4) inset;
  }
  .env-side-left, .env-side-right{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--paper-edge), var(--paper-2));
    opacity:.9;
  }
  .env-side-left{ clip-path: polygon(0 0, 50% 55%, 0 100%); }
  .env-side-right{ clip-path: polygon(100% 0, 50% 55%, 100% 100%); }
  .env-bottom{
    position:absolute; inset:0;
    background: linear-gradient(0deg, var(--paper-edge), transparent 55%);
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
    opacity:.85;
  }

  .letter-peek{
    position:absolute;
    left:6%; right:6%;
    top:10%;
    height: 42%;
    background: linear-gradient(180deg, #fffdf7, var(--paper));
    border-radius: 2px;
    box-shadow: 0 -2px 10px rgba(0,0,0,.06) inset;
    transition: transform .7s cubic-bezier(.5,.05,.25,1) .55s;
    z-index: 1;
  }
  .envelope.is-open .letter-peek{
    transform: translateY(-46%);
  }

  .env-flap{
    position:absolute;
    left:0; right:0; top:0;
    height: 58%;
    background: linear-gradient(150deg, var(--paper-2), var(--paper-edge));
    clip-path: polygon(0 0, 100% 0, 50% 92%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform .75s cubic-bezier(.6,.05,.3,1);
    z-index: 3;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
  }
  .envelope.is-open .env-flap{
    transform: rotateX(-178deg);
  }

  .wax-seal{
    position:absolute;
    left:50%; top: 47%;
    width: 15%; aspect-ratio:1;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--accent) 60%, var(--accent-2) 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.08) inset;
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif;
    color: var(--gold-light);
    font-size: clamp(.9rem, 2.6vw, 1.3rem);
    z-index:4;
    transition: transform .35s ease, opacity .3s ease;
  }
  .envelope.is-open .wax-seal{
    transform: translate(-50%,-50%) scale(.3) rotate(25deg);
    opacity:0;
  }

  .hint{
    text-align:center;
    margin-top: 22px;
    font-size: clamp(.85rem, 2vw, 1rem);
    letter-spacing:.08em;
    color: var(--hint);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }

  /* ---------- Lá thư ---------- */
  .letter-card{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 5;
    opacity:0;
    transform: scale(.22) translateY(30px);
    pointer-events:none;
    transition: transform .85s cubic-bezier(.5,.05,.2,1) .5s, opacity .5s ease .5s;
  }
  .letter-card.is-visible{
    opacity:1;
    transform: scale(1) translateY(0);
    pointer-events:auto;
  }
  .letter-inner{
    width: min(480px, 92vw);
    max-height: min(78vh, 700px);
    overflow-y:auto;
    background: linear-gradient(180deg, #fffdf8, var(--paper));
    border-radius: 4px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.03);
    padding: clamp(28px, 6vw, 48px) clamp(24px, 6vw, 44px) clamp(24px, 5vw, 36px);
    color: var(--ink);
  }
  .letter-inner::-webkit-scrollbar{ width:8px; }
  .letter-inner::-webkit-scrollbar-thumb{ background: var(--paper-edge); border-radius:8px; }

  .lc-item{ opacity:0; transform: translateY(8px); transition: opacity .6s ease, transform .6s ease; }
  .letter-card.is-visible .lc-item{ opacity:1; transform:none; }
  .letter-card.is-visible .lc-item:nth-child(1){ transition-delay: .95s; }
  .letter-card.is-visible .lc-item:nth-child(2){ transition-delay: 1.1s; }
  .letter-card.is-visible .lc-item:nth-child(3){ transition-delay: 1.25s; }
  .letter-card.is-visible .lc-item:nth-child(4){ transition-delay: 1.4s; }
  .letter-card.is-visible .lc-item:nth-child(5){ transition-delay: 1.55s; }
  .letter-card.is-visible .lc-item:nth-child(6){ transition-delay: 1.7s; }

  .lc-date{
    text-align:right;
    font-style:italic;
    color: var(--ink-soft);
    margin: 0 0 18px;
    font-size: clamp(.9rem, 2vw, 1rem);
  }
  .lc-greeting{
    font-family:'Playfair Display', serif;
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    color: var(--accent);
    margin: 0 0 16px;
  }
  .lc-body p{
    margin: 0 0 14px;
    font-size: clamp(1.02rem, 2.4vw, 1.18rem);
    line-height: 1.65;
  }
  .lc-signoff{
    margin: 22px 0 26px;
    font-size: clamp(1rem, 2.3vw, 1.12rem);
    line-height:1.6;
  }
  .lc-signoff .name{
    display:block;
    margin-top:6px;
    font-family:'Playfair Display', serif;
    font-size: clamp(1.1rem, 2.6vw, 1.3rem);
    color: var(--accent);
  }

  .qr-block{
    margin-top: 8px;
    padding-top: 24px;
    border-top: 1px solid var(--paper-edge);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
  }
  .qr-frame{
    width: min(200px, 56vw);
    padding: 10px;
    background:#fff;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 0 0 1px var(--paper-edge);
  }
  .qr-frame svg, .qr-frame img{ display:block; width:100%; height:auto; }
  .qr-caption{
    font-size: clamp(.88rem, 2vw, .98rem);
    color: var(--ink-soft);
    max-width: 34ch;
  }
  .qr-link{
    font-size: .82rem;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    word-break: break-all;
  }
  .qr-link:hover{ color: var(--accent-2); }

  .replay-row{ text-align:center; margin-top:28px; }
  .replay-btn{
    font-family: 'Cormorant Garamond', serif;
    font-size: .95rem;
    letter-spacing:.04em;
    color: var(--ink-soft);
    background:none;
    border: 1px solid var(--paper-edge);
    border-radius: 999px;
    padding: 8px 20px;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .replay-btn:hover{ background: var(--paper-2); color: var(--ink); }

  /* ---------- Khung chỉnh sửa (chỉ hiện khi thêm ?edit=1 vào link) ---------- */
  .editor{
    position:fixed;
    top:0; right:0; bottom:0;
    width: 400px;
    max-width: 100vw;
    background: var(--panel-bg);
    border-left: 1px solid var(--panel-line);
    box-shadow: -20px 0 50px rgba(0,0,0,.45);
    color: var(--panel-text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display:none;
    flex-direction:column;
    z-index: 50;
  }
  body.is-editing{ padding-right: 416px; }
  body.is-editing .editor{ display:flex; }

  .ed-head{
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--panel-line);
  }
  .ed-head h1{
    margin:0 0 6px;
    font-family: system-ui, sans-serif;
    font-size: 1rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  .ed-head p{
    margin:0;
    font-size: .8rem;
    line-height:1.5;
    color: var(--panel-muted);
  }
  .ed-body{
    flex:1;
    overflow-y:auto;
    padding: 16px 20px 20px;
  }
  .ed-field{ margin-bottom: 16px; }
  .ed-field label{
    display:block;
    font-size: .78rem;
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:6px;
    color: var(--panel-text);
  }
  .ed-field .ed-note{
    display:block;
    font-weight:400;
    font-size: .72rem;
    color: var(--panel-muted);
    margin-top:3px;
  }
  .ed-field input, .ed-field textarea{
    width:100%;
    background: var(--field-bg);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    color: var(--panel-text);
    font-family: inherit;
    font-size: .88rem;
    line-height:1.55;
    padding: 9px 11px;
    resize: vertical;
  }
  .ed-field input:focus, .ed-field textarea:focus{
    outline:none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(182,146,79,.15);
  }
  .ed-foot{
    padding: 14px 20px 18px;
    border-top: 1px solid var(--panel-line);
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .ed-btn{
    font-family: inherit;
    font-size: .87rem;
    font-weight:600;
    padding: 11px 14px;
    border-radius: 9px;
    border:1px solid transparent;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    transition: filter .15s ease, background .15s ease;
  }
  .ed-btn-primary{
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#2a2113;
  }
  .ed-btn-primary:hover{ filter: brightness(1.06); }
  .ed-btn-ghost{
    background: transparent;
    border-color: var(--panel-line);
    color: var(--panel-muted);
  }
  .ed-btn-ghost:hover{ background: rgba(255,255,255,.04); color: var(--panel-text); }
  .ed-row{ display:flex; gap:9px; }
  .ed-row .ed-btn{ flex:1; }
  .ed-toast{
    position:fixed;
    left:50%; bottom: 28px;
    transform: translate(-50%, 20px);
    background: #101319;
    border:1px solid var(--panel-line);
    color: var(--panel-text);
    font-family: system-ui, sans-serif;
    font-size: .85rem;
    padding: 11px 18px;
    border-radius: 999px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 60;
  }
  .ed-toast.is-shown{ opacity:1; transform: translate(-50%, 0); }

  @media (max-width: 820px){
    .editor{
      top:auto; left:0; right:0; bottom:0;
      width:100%;
      height: 66svh;
      border-left:none;
      border-top: 1px solid var(--panel-line);
      box-shadow: 0 -20px 40px rgba(0,0,0,.45);
    }
    body.is-editing{ padding-right:16px; padding-bottom: 68svh; }
    body.is-editing .letter-inner{ max-height: 26svh; }
    .ed-head{ padding: 14px 18px 11px; }
    .ed-foot{ padding: 11px 18px 14px; gap:7px; }
    .ed-btn{ padding: 10px 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .envelope-wrap, .env-flap, .wax-seal, .letter-peek, .letter-card, .lc-item{
      transition-duration: .01ms !important;
      transition-delay: 0s !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="scene">

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Bấm để mở thư">
      <div class="env-shadow"></div>
      <div class="env-back"></div>
      <div class="letter-peek"></div>
      <div class="env-side-left"></div>
      <div class="env-side-right"></div>
      <div class="env-bottom"></div>
      <div class="env-flap"></div>
      <div class="wax-seal" id="waxSeal">S</div>
    </div>
    <p class="hint" id="hintText">Chạm vào phong bì để mở thư</p>
  </div>

  <div class="letter-card" id="letterCard" aria-live="polite">
    <div class="letter-inner">
      <p class="lc-date lc-item" id="lcDate"></p>
      <p class="lc-greeting lc-item" id="lcGreeting"></p>
      <div class="lc-body lc-item" id="lcBody"></div>
      <p class="lc-signoff lc-item" id="lcSignoff"></p>

      <div class="qr-block lc-item">
        <div class="qr-frame" id="qrFrame"></div>
        <p class="qr-caption" id="qrCaption"></p>
        <a class="qr-link" id="qrLink" target="_blank" rel="noopener"></a>
      </div>

      <div class="replay-row lc-item">
        <button class="replay-btn" id="replayBtn" type="button">Gấp thư lại</button>
      </div>
    </div>
  </div>

</div>

<!-- Khung chỉnh sửa: chỉ hiện khi mở trang với ?edit=1 -->
<aside class="editor" id="editor" aria-label="Chỉnh sửa nội dung thư">
  <div class="ed-head">
    <h1>Chế độ chỉnh sửa</h1>
    <p>Sửa xong bấm “Tải file đã sửa xuống” rồi đem file đó đi deploy. Người nhận mở link thường sẽ không thấy khung này.</p>
  </div>
  <div class="ed-body">
    <div class="ed-field">
      <label for="fPageTitle">Tiêu đề trang <span class="ed-note">Hiện trên tab trình duyệt và khi chia sẻ link</span></label>
      <input type="text" id="fPageTitle" data-key="pageTitle">
    </div>
    <div class="ed-field">
      <label for="fMonogram">Chữ trên con dấu sáp <span class="ed-note">1–2 ký tự</span></label>
      <input type="text" id="fMonogram" data-key="monogram" maxlength="2">
    </div>
    <div class="ed-field">
      <label for="fHint">Dòng chữ dưới phong bì</label>
      <input type="text" id="fHint" data-key="hint">
    </div>
    <div class="ed-field">
      <label for="fDate">Ngày tháng <span class="ed-note">Để trống = tự lấy tháng/năm hiện tại</span></label>
      <input type="text" id="fDate" data-key="dateText">
    </div>
    <div class="ed-field">
      <label for="fGreeting">Lời chào đầu thư</label>
      <input type="text" id="fGreeting" data-key="greeting">
    </div>
    <div class="ed-field">
      <label for="fBody">Nội dung thư <span class="ed-note">Mỗi đoạn một dòng — bấm Enter để xuống đoạn mới</span></label>
      <textarea id="fBody" data-key="body" rows="12"></textarea>
    </div>
    <div class="ed-field">
      <label for="fSignoff">Lời kết</label>
      <input type="text" id="fSignoff" data-key="signoffLine">
    </div>
    <div class="ed-field">
      <label for="fSignName">Chữ ký</label>
      <input type="text" id="fSignName" data-key="signoffName">
    </div>
    <div class="ed-field">
      <label for="fQrImage">Ảnh mã QR <span class="ed-note" id="qrModeLabel"></span></label>
      <input type="file" id="fQrImage" accept="image/*">
      <button class="ed-btn ed-btn-ghost" id="btnClearQrImage" type="button" style="margin-top:8px">Xoá ảnh, tự tạo QR từ link</button>
    </div>
    <div class="ed-field">
      <label for="fQrLink">Link của mã QR <span class="ed-note">Dùng để tự tạo QR khi không có ảnh, và làm dòng link bấm được dưới mã</span></label>
      <input type="url" id="fQrLink" data-key="qrLink" placeholder="https://...">
    </div>
    <div class="ed-field">
      <label for="fQrCaption">Chú thích dưới mã QR</label>
      <input type="text" id="fQrCaption" data-key="qrCaption">
    </div>
  </div>
  <div class="ed-foot">
    <button class="ed-btn ed-btn-primary" id="btnDownload" type="button">Tải file đã sửa xuống</button>
    <div class="ed-row">
      <button class="ed-btn ed-btn-ghost" id="btnSaveDraft" type="button">Lưu nháp</button>
      <button class="ed-btn ed-btn-ghost" id="btnClearDraft" type="button">Xoá nháp</button>
    </div>
    <a class="ed-btn ed-btn-ghost" id="btnPreviewAsGuest" href="#">Xem như người nhận</a>
  </div>
</aside>
<div class="ed-toast" id="edToast" role="status"></div>

<!-- =========================================================================
     NỘI DUNG LÁ THƯ
     Bạn KHÔNG cần sửa tay ở đây: mở trang với ?edit=1 để sửa bằng giao diện.
     (Nếu muốn sửa tay thì đây là chỗ duy nhất cần đổi — nhớ giữ đúng dấu ngoặc
     và dấu phẩy của JSON.)
     ========================================================================= -->
<script type="application/json" id="letterConfig">
{
  "pageTitle": "A Letter to you",
  "monogram": "S",
  "hint": "Tap to open it :D",
  "greeting": "Gửi em",
  "body": [
    "Anh vibe code nên hơi lộn xộn. Mong em dành chút thời gian đọc nó. cái này là ý tưởng của a nhân dịp kỉ niệm tụi mình mà anh cũng sợ k đc dùng đến nó nữa :(( Em xem thử nha :D"
  ],
  "signoffLine": "Cảm ơn em,",

<script>
/* Bản sao nguyên gốc của trang, chụp trước khi JS thay đổi bất cứ thứ gì.
   Dùng để sinh lại file HTML khi bấm "Tải file đã sửa xuống". */
var PRISTINE_HTML = document.documentElement.outerHTML;

var DEFAULTS = {
  pageTitle: "Một Lá Thư",
  monogram: "S",
  hint: "Chạm vào phong bì để mở thư",
  greeting: "Gửi người mà tôi luôn trân trọng,",
  body: ["(Chưa có nội dung — mở trang với ?edit=1 để soạn thư.)"],
  signoffLine: "Trân trọng,",
  signoffName: "",

  qrCaption: "Quét mã để xem thêm",
  qrImage: ""
};

var DRAFT_KEY = "la-thu-tay-draft";

function readConfigFromPage(){
  var cfg = {};
  for (var k in DEFAULTS) cfg[k] = DEFAULTS[k];
  try{
    var el = document.getElementById("letterConfig");
    if (el){
      var parsed = JSON.parse(el.textContent);
      for (var key in parsed){
        if (parsed[key] !== undefined && parsed[key] !== null) cfg[key] = parsed[key];
      }
    }
  }catch(e){
    console.warn("Nội dung JSON của thư bị lỗi cú pháp, đang dùng nội dung mặc định.", e);
  }
  return cfg;
}

var CONFIG = readConfigFromPage();

var params;
try{ params = new URLSearchParams(window.location.search); }catch(e){ params = null; }
var IS_EDIT = !!(params && (params.get("edit") === "1" || params.get("edit") === "true"));

/* Ghi đè nhanh link QR qua URL: ...?link=https%3A%2F%2F... */
if (params && params.get("link")) CONFIG.qrLink = params.get("link");

/* Nháp đang sửa chỉ được áp dụng trong chế độ chỉnh sửa, để người nhận
   luôn thấy đúng nội dung đã ghi trong file. */
if (IS_EDIT){
  try{
    var draft = window.localStorage.getItem(DRAFT_KEY);
    if (draft){
      var d = JSON.parse(draft);
      for (var dk in d){ if (d[dk] !== undefined) CONFIG[dk] = d[dk]; }
    }
  }catch(e){}
}

/* ---------- Hiển thị lá thư ---------- */
/* Mã QR: ưu tiên ảnh bạn tự nhúng (CONFIG.qrImage); nếu không có thì tự tạo
   mã QR từ CONFIG.qrLink. */
function renderQR(){
  var frame = document.getElementById("qrFrame");
  if (CONFIG.qrImage){
    frame.innerHTML = "";
    var img = document.createElement("img");
    img.src = CONFIG.qrImage;
    img.alt = "Mã QR";
    frame.appendChild(img);
    return;
  }
  try{
    var qr = qrcode(0, "M");
    qr.addData(CONFIG.qrLink || "");
    qr.make();
    frame.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
  }catch(e){
    frame.textContent = "Không tạo được mã QR — kiểm tra lại đường link.";
  }
}

/* Đổ toàn bộ chữ trong CONFIG ra lá thư (không gồm phần vẽ mã QR) */
function paintText(){
  document.title = CONFIG.pageTitle || "Một Lá Thư";
  document.getElementById("waxSeal").textContent = CONFIG.monogram || "";
  document.getElementById("hintText").textContent = CONFIG.hint || "";
  document.getElementById("lcGreeting").textContent = CONFIG.greeting || "";

  var bodyEl = document.getElementById("lcBody");
  bodyEl.innerHTML = "";
  var paragraphs = Array.isArray(CONFIG.body) ? CONFIG.body : String(CONFIG.body || "").split("\n");
  paragraphs.forEach(function(text){
    if (!String(text).trim()) return;
    var para = document.createElement("p");
    para.textContent = text;
    bodyEl.appendChild(para);
  });

  var signoff = document.getElementById("lcSignoff");
  signoff.innerHTML = "";
  signoff.appendChild(document.createTextNode(CONFIG.signoffLine || ""));
  var nameEl = document.createElement("span");
  nameEl.className = "name";
  nameEl.textContent = CONFIG.signoffName || "";
  signoff.appendChild(nameEl);

  var dateText = CONFIG.dateText;
  if (!dateText){
    try{ dateText = new Date().toLocaleDateString("vi-VN", { month: "long", year: "numeric" }); }
    catch(e){ dateText = ""; }
  }
  document.getElementById("lcDate").textContent = dateText;

  document.getElementById("qrCaption").textContent = CONFIG.qrCaption || "";

  var linkEl = document.getElementById("qrLink");
  if (CONFIG.qrLink){
    linkEl.href = CONFIG.qrLink;
    linkEl.textContent = CONFIG.qrLink;
    linkEl.hidden = false;
  } else {
    linkEl.removeAttribute("href");
    linkEl.textContent = "";
    linkEl.hidden = true;
  }
}

function renderLetter(){
  paintText();
  renderQR();
}

/* ---------- Mở / gấp thư ---------- */
var isOpen = false;
function openLetter(){
  if (isOpen) return;
  isOpen = true;
  document.getElementById("envelope").classList.add("is-open");
  document.getElementById("envelopeWrap").classList.add("is-hidden");
  document.getElementById("letterCard").classList.add("is-visible");
}
function closeLetter(){
  if (!isOpen) return;
  isOpen = false;
  document.getElementById("letterCard").classList.remove("is-visible");
  document.getElementById("envelopeWrap").classList.remove("is-hidden");
  document.getElementById("envelope").classList.remove("is-open");
}

(function initOpening(){
  var envelope = document.getElementById("envelope");
  envelope.addEventListener("click", openLetter);
  envelope.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openLetter(); }
  });
  document.getElementById("replayBtn").addEventListener("click", closeLetter);
})();

/* ---------- Chế độ chỉnh sửa ---------- */
function toast(message){
  var el = document.getElementById("edToast");
  el.textContent = message;
  el.classList.add("is-shown");
  window.clearTimeout(toast._t);
  toast._t = window.setTimeout(function(){ el.classList.remove("is-shown"); }, 2600);
}

function buildEditedHtml(cfg){
  var json = JSON.stringify(cfg, null, 2).replace(/</g, "\\u003c");
  var out = PRISTINE_HTML.replace(
    /(<script type="application\/json" id="letterConfig">)[\s\S]*?(<\/script>)/,
    function(){ return arguments[1] + "\n" + json + "\n" + arguments[2]; }
  );
  return "<!DOCTYPE html>\n" + out;
}

function initEditor(){
  document.body.classList.add("is-editing");

  var fields = Array.prototype.slice.call(document.querySelectorAll("[data-key]"));

  function fieldToConfig(){
    var cfg = {};
    for (var k in CONFIG) cfg[k] = CONFIG[k];
    fields.forEach(function(input){
      var key = input.getAttribute("data-key");
      if (key === "body"){
        cfg.body = input.value.split("\n").map(function(s){ return s.trim(); })
                              .filter(function(s){ return s.length > 0; });
      } else {
        cfg[key] = input.value;
      }
    });
    return cfg;
  }

  /* Nạp giá trị hiện tại vào các ô nhập */
  fields.forEach(function(input){
    var key = input.getAttribute("data-key");
    if (key === "body"){
      var arr = Array.isArray(CONFIG.body) ? CONFIG.body : [String(CONFIG.body || "")];
      input.value = arr.join("\n");
    } else {
      input.value = CONFIG[key] == null ? "" : CONFIG[key];
    }
  });

  function updateQrModeLabel(){
    document.getElementById("qrModeLabel").textContent = CONFIG.qrImage
      ? "— đang dùng ảnh bạn nhúng"
      : "— đang tự tạo mã QR từ link bên dưới";
  }
  updateQrModeLabel();

  var qrTimer = null;
  fields.forEach(function(input){
    input.addEventListener("input", function(){
      var previousLink = CONFIG.qrLink;
      CONFIG = fieldToConfig();
      paintText();
      if (CONFIG.qrLink !== previousLink && !CONFIG.qrImage){
        window.clearTimeout(qrTimer);
        qrTimer = window.setTimeout(renderQR, 250);
      }
    });
  });

  /* Chọn ảnh QR từ máy — ảnh được nhúng thẳng vào file, không cần hosting riêng */
  document.getElementById("fQrImage").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      CONFIG.qrImage = String(reader.result);
      renderQR();
      updateQrModeLabel();
      var kb = Math.round(CONFIG.qrImage.length / 1024);
      toast(kb > 900
        ? "Đã nhúng ảnh QR (~" + kb + " KB) — ảnh khá lớn, nên dùng ảnh PNG nhỏ hơn cho nhẹ."
        : "Đã nhúng ảnh QR bạn chọn.");
    };
    reader.onerror = function(){ toast("Không đọc được ảnh này, thử ảnh khác nhé."); };
    reader.readAsDataURL(file);
  });

  document.getElementById("btnClearQrImage").addEventListener("click", function(){
    CONFIG.qrImage = "";
    document.getElementById("fQrImage").value = "";
    renderQR();
    updateQrModeLabel();
    toast("Đã bỏ ảnh — mã QR giờ tự tạo từ link.");
  });

  document.getElementById("btnDownload").addEventListener("click", function(){
    var cfg = fieldToConfig();
    try{ window.localStorage.setItem(DRAFT_KEY, JSON.stringify(cfg)); }catch(e){}
    var blob = new Blob([buildEditedHtml(cfg)], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast("Đã tải file index.html — đem file này đi deploy là xong.");
  });

  document.getElementById("btnSaveDraft").addEventListener("click", function(){
    try{
      window.localStorage.setItem(DRAFT_KEY, JSON.stringify(fieldToConfig()));
      toast("Đã lưu nháp trong máy này.");
    }catch(e){
      toast("Không lưu được nháp trên trình duyệt này.");
    }
  });

  document.getElementById("btnClearDraft").addEventListener("click", function(){
    try{ window.localStorage.removeItem(DRAFT_KEY); }catch(e){}
    toast("Đã xoá nháp. Tải lại trang để về nội dung trong file.");
  });

  var guestLink = document.getElementById("btnPreviewAsGuest");
  guestLink.href = window.location.pathname + (CONFIG.qrLink && params && params.get("link") ? "?link=" + encodeURIComponent(CONFIG.qrLink) : "");

  /* Mở sẵn lá thư để xem trước ngay khi đang sửa */
  window.setTimeout(openLetter, 150);
}

renderLetter();
if (IS_EDIT) initEditor();
</script></body></html>
